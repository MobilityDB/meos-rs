name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "stable-1.3" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-system:
    name: Test (system MEOS)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing libgeos-dev proj-bin libproj-dev proj-data libjson-c-dev libgsl-dev

    - name: Install MEOS
      run: |
        git clone --branch stable-1.3 https://github.com/MobilityDB/MobilityDB.git
        mkdir MobilityDB/build
        cd MobilityDB/build
        cmake .. -DMEOS=on
        make -j
        sudo make install

    - name: Add library to LDPATH
      run: echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib" >> $GITHUB_ENV

    - name: Build
      run: cargo build --verbose --no-default-features --features geos

    - name: Clippy
      run: cargo clippy --no-default-features --features geos -- -D warnings

    - name: Run tests
      run: cargo test --verbose --no-default-features --features geos

    - name: Download example data
      run: |
        mkdir -p data
        curl -o data/ais_instants.csv https://raw.githubusercontent.com/MobilityDB/MobilityDB/master/meos/examples/data/ais_instants.csv

    - name: Run examples
      run: |
        cargo run --example 01_hello_world --no-default-features --features geos
        cargo run --example 02_ais_read --no-default-features --features geos
        cargo run --example 03_ais_assemble --no-default-features --features geos

  codegen-drift:
    name: FFI generated from the catalog (no drift)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Derive the MEOS catalog from the stable-1.3 line the crate pins (the 1.3 family set has
    # no -DALL). meos-sys is a projection of it: sys/src/generated.rs must equal what codegen.py
    # emits from the current catalog, so a MEOS API change surfaces here instead of silently
    # rotting the committed FFI.
    - name: Provision the MEOS catalog (stable-1.3)
      id: provision
      uses: MobilityDB/MEOS-API/.github/actions/provision-meos@master
      with:
        mobilitydb-ref: stable-1.3
        build-libmeos: "true"
        families: "-DCBUFFER=ON -DNPOINT=ON -DPOSE=ON"

    - name: Regenerate the FFI from the catalog
      run: python3 sys/codegen.py "${{ steps.provision.outputs.catalog-path }}" sys/src/generated.rs

    - name: Assert the committed FFI matches the catalog
      run: git diff --exit-code sys/src/generated.rs

  test-bundled:
    name: Test (bundled MEOS)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build tools
      run: sudo apt-get install -y cmake clang libclang-dev pkg-config sqlite3 libsqlite3-dev

    - name: Build
      run: cargo build --verbose --features bundled

    - name: Clippy
      run: cargo clippy --features bundled -- -D warnings

    - name: Run tests
      run: cargo test --verbose --features bundled

    - name: Download example data
      run: |
        mkdir -p data
        curl -o data/ais_instants.csv https://raw.githubusercontent.com/MobilityDB/MobilityDB/master/meos/examples/data/ais_instants.csv

    - name: Run examples
      run: |
        cargo run --example 01_hello_world --features bundled
        cargo run --example 02_ais_read --features bundled
        cargo run --example 03_ais_assemble --features bundled
