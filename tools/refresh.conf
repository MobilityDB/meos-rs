# refresh.conf — meos-rs's last leg for tools/refresh-binding.sh (in MEOS-API).
# The meos crate pins MobilityDB stable-1.3 (sys/meos-src/source submodule), so the catalog is
# derived from stable-1.3, NOT master; deriving from master would drift the crate's public 1.3 API
# and break users. The 1.3 family set has no -DALL (that is newer), so FAMILIES lists them.
# sys/codegen.py takes the catalog path as an argument (CATALOG_DEST empty) and rewrites the
# committed sys/src/generated.rs; the crate links libmeos via MEOS_LIB_DIR.
ENGINE=rust
BUILD_DIR=.
BUILD_LIBMEOS=true
MDB_REF=stable-1.3
FAMILIES=-DCBUFFER=ON -DNPOINT=ON -DPOSE=ON
CATALOG_DEST=
BUILD_CMD='python3 sys/codegen.py "$CATALOG" sys/src/generated.rs
  export MEOS_LIB_DIR="$PREFIX/lib" LD_LIBRARY_PATH="$PREFIX/lib"
  cargo build --no-default-features --features geos
  cargo clippy --no-default-features --features geos -- -D warnings
  [ -n "${SKIP_TESTS:-}" ] || cargo test --no-default-features --features geos'
